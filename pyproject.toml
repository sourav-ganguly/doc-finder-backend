[tool.poetry]
name = "doc-finder-backend"
version = "0.1.0"
description = "Backend for Doc Finder."

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
fastapi = "0.109.2"
uvicorn = "0.27.1"
sqlalchemy = "2.0.27"
psycopg2-binary = "2.9.9"
python-dotenv = "1.0.1"
pydantic = "2.6.1"
alembic = "1.13.1"
openai = "0.28.1"
python-jose = { extras = ["cryptography"], version = "3.3.0" }
passlib = { extras = ["bcrypt"], version = "1.7.4" }
python-multipart = "0.0.6"
email-validator = "2.1.0"
ruff = "0.9.9"
slowapi = { version = "0.1.8", python = ">=3.10,<4.0" }

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# Enable Ruff formatter
line-length = 88
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # do not perform function call in argument defaults (common in FastAPI)
    "PLR0913", # too many arguments to function call
    "ARG001",  # unused function argument (common with FastAPI dependency injection)
    "ARG002",  # unused method argument
    "N805",    # first argument of a method should be named 'self' (conflicts with FastAPI dependency injection)
    "PLC1901", # compare to empty string
    "PLW0603", # global statement 
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
